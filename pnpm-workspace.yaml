packages:
  - "apps/*"
  - "packages/*"

# pnpm no corre scripts de instalación salvo que se los autorice acá, uno por uno.
# esbuild necesita el suyo para dejar el binario de la plataforma; sin eso no
# arrancan vitest, tsx ni drizzle-kit. sharp queda denegado a propósito: Next
# resuelve la optimización de imágenes con los paquetes precompilados por
# plataforma, así que su script no hace falta.
allowBuilds:
  esbuild: true
  sharp: false

# next pinea postcss 8.4.31 exacto (también en la 16), afectada por
# GHSA-r28c-9q8g-f849: path traversal al cargar source maps previos. Corregido en
# 8.5.18, que es la línea que ya usan @tailwindcss/postcss y vite.
overrides:
  postcss: ">=8.5.18"
